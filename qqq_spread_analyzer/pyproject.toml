[tool.poetry]
name = "qqq-spread-analyzer"
version = "0.1.0"
description = "QQQ 2-4 week options spread research CLI (IB Gateway data only)"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
ib-insync = "^0.9.86"
pandas = "^2.2.0"
numpy = ">=1.26.0,<3.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
duckdb = "^1.1.0"
rich = "^13.9.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
