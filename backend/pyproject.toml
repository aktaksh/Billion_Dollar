[tool.poetry]
name = "billion-dollar-backend"
version = "0.3.0"
description = "Billion Dollar FastAPI backend"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = "0.115.0"
uvicorn = "0.30.6"
pydantic = "2.9.2"
sqlalchemy = "2.0.36"
httpx = "0.27.2"
python-multipart = "0.0.12"
ib-insync = "^0.9.86"
apscheduler = "^3.10.4"
pyyaml = "^6.0.2"
ibapi = "^9.81.1.post1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "tws: optional live TWS paper integration (set TWS_INTEGRATION=1)",
    "slow: long-running live broker or scanner integration",
]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
