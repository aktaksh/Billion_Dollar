broker_backend: tws
tws_host: 127.0.0.1
tws_port: 4001
tws_client_id: 2
tws_read_only: true
# IB market data: 1=live, 2=frozen (last close, useful off-hours), 3=delayed, 4=delayed frozen
tws_market_data_type: 1

options_chain:
  enabled: true
  symbols:
    - QQQ
  default_symbol: QQQ
  min_dte: 14
  max_dte: 35
  strike_pct_range: 0.10
  quote_batch_size: 40
  quote_tick_wait_seconds: 3
  max_expiries: 4
  strikes_below: 8
  strikes_above: 12
  strike_interval: 5
  max_contracts_per_scan: 200
  allow_exceed_max_contracts: false
  batch_delay_seconds: 5
  refresh_seconds: 120
  runtime_max_age_seconds: 900
  metadata_refresh_minutes: 20
  max_spread_pct: 0.08
  min_open_interest: 500
  min_volume: 100
  # Local dev only: allow Strategy Builder on stale broker-backed cache (off-hours testing)
  allow_stale_runtime_dev: false
